name: Tests

# Cuándo corre:
#   - En cada PR contra main
#   - En cada push a main (post-merge, sirve de smoke test del estado de main)
#
# Qué chequea:
#   - npm ci limpio (sin estados raros del lockfile)
#   - tsc --noEmit (sin errores de tipos)
#   - npm test (Vitest, los 19+ tests del checkout y futuros)
#
# Branch protection (configurar en GitHub Settings → Branches):
#   - Require status check "Tests / unit" antes de merge a main
#   - Esto convierte los tests en bloqueante real, no honor system

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancelar runs viejos cuando llega un nuevo push al mismo PR.
# Ahorra minutos y evita que un PR muestre un check de un commit que ya no existe.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Type check primero — es rápido y atrapa errores antes que los tests
      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
